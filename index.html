<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA와 RNA의 구조 비교</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #f0e8f8 50%, #f8f0e8 100%);
            min-height: 100vh;
            color: #333;
        }

        header {
            text-align: center;
            padding: 28px 20px 16px;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        header h1 { font-size: 1.9em; color: #2d3748; margin-bottom: 6px; }
        header p  { color: #888; font-size: 0.95em; }

        .input-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 24px 20px 10px;
            flex-wrap: wrap;
        }

        .input-box {
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 1.05em;
            width: 200px;
            outline: none;
            background: white;
            transition: border 0.3s;
            text-transform: uppercase;
            color: #2d3748;
        }
        .input-box:focus { border-color: #667eea; }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 26px;
            border: none;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s;
        }

        .btn-dna   { background: linear-gradient(135deg, #4299e1, #3182ce); color: white; }
        .btn-rna   { background: linear-gradient(135deg, #ed8936, #dd6b20); color: white; }
        .btn-reset { background: #e2e8f0; color: #4a5568; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.15); }

        .error-msg {
            text-align: center;
            color: #e53e3e;
            font-size: 0.9em;
            min-height: 20px;
            padding: 4px;
        }

        .result-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 20px 30px 50px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 24px 20px;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.09);
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            text-align: center;
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 18px;
            padding: 8px 0;
            border-radius: 8px;
        }

        .dna-title { background: #ebf8ff; color: #2b6cb0; }
        .rna-title { background: #fef3e2; color: #c05621; }

        .section-label {
            font-size: 0.85em;
            font-weight: bold;
            color: #718096;
            text-align: center;
            margin: 10px 0 6px;
            letter-spacing: 0.5px;
        }

        canvas { display: block; margin: 0 auto; }

        .divider {
            border: none;
            border-top: 1px dashed #e2e8f0;
            margin: 16px 0;
        }

        .info-box {
            background: #f7fafc;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.88em;
            line-height: 1.9;
            color: #4a5568;
        }
        .info-box b { color: #2d3748; }

        .tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin: 1px;
        }

        .compare-card {
            background: white;
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.09);
            animation: fadeUp 0.6s ease;
        }
        .compare-card h2 {
            text-align: center;
            font-size: 1.15em;
            color: #4a5568;
            margin-bottom: 18px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.88em; }

        th { padding: 10px 14px; text-align: center; font-weight: bold; }
        th:nth-child(1) { color: #718096; background: #f7fafc; }
        th:nth-child(2) { background: #ebf8ff; color: #2b6cb0; }
        th:nth-child(3) { background: #fef3e2; color: #c05621; }

        td {
            padding: 9px 14px;
            border-bottom: 1px solid #edf2f7;
            text-align: center;
            color: #4a5568;
        }
        td:first-child {
            font-weight: bold;
            color: #718096;
            background: #f7fafc;
            text-align: left;
        }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) td:not(:first-child) { background: #fafafa; }
    </style>
</head>
<body>

<header>
    <h1>🧬 DNA와 RNA의 구조 비교</h1>
    <p>DNA 또는 RNA를 입력하고 버튼을 눌러 구조를 확인해 보세요!</p>
</header>

<div class="input-section">
    <input class="input-box" id="molInput" type="text"
           placeholder="DNA 또는 RNA 입력" maxlength="3" />
    <div class="btn-group">
        <button class="btn-dna"   onclick="showStructure('DNA')">🔵 DNA 보기</button>
        <button class="btn-rna"   onclick="showStructure('RNA')">🟠 RNA 보기</button>
        <button class="btn-reset" onclick="resetAll()">↺ 초기화</button>
    </div>
</div>
<div class="error-msg" id="errorMsg"></div>

<div class="result-section" id="resultSection"></div>

<script>
// ────────────────────────────────────────
//  색상 팔레트
// ────────────────────────────────────────
const BASE_COLOR = {
    A: { fill:'#E8735A', stroke:'#c0392b', text:'white' },
    T: { fill:'#F5C842', stroke:'#d4a017', text:'#333'  },
    G: { fill:'#5BAD6F', stroke:'#27ae60', text:'white' },
    C: { fill:'#5B8ED6', stroke:'#2980b9', text:'white' },
    U: { fill:'#B57BDB', stroke:'#8e44ad', text:'white' }
};

const DNA_SUGAR  = { fill:'#E8A598', stroke:'#c0392b' };
const RNA_SUGAR  = { fill:'#A8D8A8', stroke:'#27ae60' };
const PHOSPHATE  = { fill:'#7EC8E3', stroke:'#2980b9' };

// ────────────────────────────────────────
//  오류 / 리셋
// ────────────────────────────────────────
function setError(m){ document.getElementById('errorMsg').textContent = m; }
function resetAll(){
    document.getElementById('molInput').value = '';
    document.getElementById('resultSection').innerHTML = '';
    setError('');
}

// ────────────────────────────────────────
//  진입점
// ────────────────────────────────────────
function showStructure(type){
    const input = document.getElementById('molInput').value.trim().toUpperCase();
    setError('');
    if(input !== '' && input !== type){
        setError(`⚠️ 입력값 "${input}" 과 버튼(${type})이 다릅니다. 빈칸으로 두거나 맞게 입력하세요.`);
        return;
    }
    const sec = document.getElementById('resultSection');
    sec.innerHTML = '';
    if(type === 'DNA') buildDNACard(sec);
    else               buildRNACard(sec);
    buildCompare(sec);
}

// ════════════════════════════════════════
//  공통 드로잉 헬퍼
// ════════════════════════════════════════
function makeCanvas(w, h){
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
}

// 오각형(당)
function drawPentagon(ctx, cx, cy, r, color){
    ctx.beginPath();
    for(let i = 0; i < 5; i++){
        const a = (i * 72 - 90) * Math.PI / 180;
        i === 0
            ? ctx.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a))
            : ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    }
    ctx.closePath();
    ctx.fillStyle   = color.fill;
    ctx.strokeStyle = color.stroke;
    ctx.lineWidth   = 2;
    ctx.fill(); ctx.stroke();
}

// 원(인산)
function drawCircle(ctx, cx, cy, r, color){
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle   = color.fill;
    ctx.strokeStyle = color.stroke;
    ctx.lineWidth   = 2;
    ctx.fill(); ctx.stroke();
}

// 화살표 모양 염기
function drawBase(ctx, cx, cy, w, h, color, label){
    const x = cx - w / 2, y = cy - h / 2;
    const tip = 8;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w - tip, y);
    ctx.lineTo(x + w, cy);
    ctx.lineTo(x + w - tip, y + h);
    ctx.lineTo(x, y + h);
    ctx.closePath();
    ctx.fillStyle   = color.fill;
    ctx.strokeStyle = color.stroke;
    ctx.lineWidth   = 1.5;
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = color.text;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, cx - 2, cy);
}

// 선
function line(ctx, x1, y1, x2, y2, color='#aaa', lw=1.5, dash=[]){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.setLineDash(dash);
    ctx.stroke();
    ctx.restore();
}

// 텍스트
function txt(ctx, s, x, y, font='12px sans-serif', color='#555', align='center'){
    ctx.save();
    ctx.font = font; ctx.fillStyle = color;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
    ctx.restore();
}

// ════════════════════════════════════════
//  뉴클레오타이드 일러스트 (말풍선)
//  ★ 디옥시라이보스 / 라이보스 표기 적용
// ════════════════════════════════════════
function drawNucleotideIllust(canvas, type){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const sugarColor = type === 'DNA' ? DNA_SUGAR : RNA_SUGAR;
    // ★ 교과서 표기로 변경
    const sugarLabel = type === 'DNA' ? '디옥시\n라이보스' : '라이보스';
    const baseColor  = BASE_COLOR['A'];

    // 타원 배경
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(W/2, H/2, W/2 - 8, H/2 - 8, 0, 0, Math.PI * 2);
    ctx.fillStyle   = type === 'DNA' ? '#fff8ee' : '#eeffee';
    ctx.strokeStyle = type === 'DNA' ? '#f0b97a' : '#7ab87a';
    ctx.lineWidth   = 2;
    ctx.fill(); ctx.stroke();
    ctx.restore();

    const cx = W / 2, cy = H / 2 + 10;

    // 인산 원
    const px = cx - 40, py = cy - 50;
    drawCircle(ctx, px, py, 22, PHOSPHATE);
    txt(ctx, '인산',  px, py - 4, 'bold 11px sans-serif', 'white');
    txt(ctx, '(PO₄)', px, py + 9, '9px sans-serif',       'white');

    // 당 오각형
    const sx = cx, sy = cy + 5;
    drawPentagon(ctx, sx, sy, 28, sugarColor);

    // ★ 당 라벨 (디옥시라이보스 / 라이보스)
    ctx.save();
    ctx.fillStyle = '#555';
    ctx.font = 'bold 9.5px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lines2 = sugarLabel.split('\n');
    lines2.forEach((l, i) => ctx.fillText(l, sx, sy - 5 + i * 13));
    ctx.restore();

    txt(ctx, '당', sx, sy + 38, '10px sans-serif', '#888');

    // 염기
    const bx = cx + 68, by = cy + 5;
    drawBase(ctx, bx, by, 44, 24, baseColor, 'A');
    txt(ctx, '염기', bx + 2, by + 22, '10px sans-serif', '#888');

    // 연결선
    line(ctx, px + 18, py + 6,  sx - 16, sy - 16, '#aaa', 2);
    line(ctx, sx + 22, sy,       bx - 30, by,      '#aaa', 2);

    txt(ctx,
        `${type}를 구성하는 뉴클레오타이드`,
        W / 2, 16, 'bold 11px sans-serif', '#555');
}

// ════════════════════════════════════════
//  뉴클레오타이드 체인
//  ★ 디옥시라이보스 / 라이보스 표기 적용
// ════════════════════════════════════════
function drawChain(canvas, type){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const sugarColor = type === 'DNA' ? DNA_SUGAR : RNA_SUGAR;
    const bases = type === 'DNA'
        ? ['G', 'C', 'T', 'A']
        : ['G', 'C', 'U', 'A'];

    const startY = 30;
    const stepY  = (H - startY - 20) / bases.length;
    const px_x   = 55;
    const sx_x   = 105;
    const bx_x   = 160;

    txt(ctx,
        type === 'DNA' ? 'DNA 뉴클레오타이드 체인' : 'RNA 뉴클레오타이드 체인',
        W / 2, 14, 'bold 11px sans-serif', '#555');

    for(let i = 0; i < bases.length; i++){
        const cy = startY + i * stepY + stepY / 2;
        const bc = BASE_COLOR[bases[i]];

        // 인산 원
        drawCircle(ctx, px_x, cy, 16, PHOSPHATE);
        txt(ctx, 'P', px_x, cy, 'bold 11px sans-serif', 'white');

        // 인산→당 연결선
        line(ctx, px_x + 16, cy, sx_x - 20, cy, '#999', 1.8);

        // 당 오각형
        drawPentagon(ctx, sx_x, cy, 20, sugarColor);

        // 당→염기 연결선
        line(ctx, sx_x + 18, cy, bx_x, cy, '#999', 1.8);

        // 염기
        drawBase(ctx, bx_x + 22, cy, 42, 22, bc, bases[i]);

        // 수직 골격 연결 (인산끼리)
        if(i > 0){
            const prevCY = startY + (i - 1) * stepY + stepY / 2;
            line(ctx, px_x, prevCY + 16, px_x, cy - 16, '#7EC8E3', 2.5);
        }
    }

    // 하단 레이블
    txt(ctx, '인산', px_x, H - 10, '10px sans-serif', '#7EC8E3');
    txt(ctx, '당',   sx_x, H - 10, '10px sans-serif',
        type === 'DNA' ? DNA_SUGAR.stroke : RNA_SUGAR.stroke);
    txt(ctx, '염기', bx_x + 22, H - 10, '10px sans-serif', '#888');
}

// ════════════════════════════════════════
//  DNA 이중 나선
// ════════════════════════════════════════
function drawDNAHelix(canvas){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const pairs = [
        ['C','G'],['A','T'],['G','C'],['T','A'],
        ['A','T'],['G','C'],['C','G'],['T','A'],['A','T'],['G','C']
    ];

    const n   = pairs.length;
    const cx  = W / 2;
    const top = 30, bot = H - 20;
    const amp = 78;
    const step = (bot - top) / n;

    txt(ctx, 'DNA 이중 나선 구조', cx, 14, 'bold 12px sans-serif', '#2b6cb0');

    // 골격 좌표 계산
    const left = [], right = [];
    for(let i = 0; i < n; i++){
        const t = (i / (n - 1)) * Math.PI * 2;
        const y = top + i * step + step / 2;
        left.push ({ x: cx - amp * Math.cos(t), y });
        right.push({ x: cx + amp * Math.cos(t), y });
    }

    // 리본 골격
    function drawRibbon(pts, color){
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for(let i = 1; i < pts.length; i++){
            const mx = (pts[i-1].x + pts[i].x) / 2;
            const my = (pts[i-1].y + pts[i].y) / 2;
            ctx.quadraticCurveTo(pts[i-1].x, pts[i-1].y, mx, my);
        }
        ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
        ctx.strokeStyle = color; ctx.lineWidth = 10;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.globalAlpha = 0.7;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
    }

    drawRibbon(left,  '#5B9BD5');
    drawRibbon(right, '#5B9BD5');

    // 염기쌍
    for(let i = 0; i < n; i++){
        const lp = left[i], rp = right[i];
        const b1 = pairs[i][0], b2 = pairs[i][1];
        const isAT = (b1 === 'A' || b1 === 'T');

        // 수소결합 점선
        line(ctx, lp.x + 16, lp.y, rp.x - 16, rp.y,
             'rgba(180,180,180,0.7)', 1.5, [3, 3]);

        // 결합 종류
        txt(ctx, isAT ? '= (2중)' : '≡ (3중)',
            cx, lp.y - 1, '8px sans-serif', 'rgba(100,100,100,0.7)');

        // 왼쪽 염기
        drawBase(ctx, lp.x, lp.y, 40, 22, BASE_COLOR[b1], b1);

        // 오른쪽 염기 (좌우 반전)
        ctx.save();
        ctx.translate(rp.x, rp.y);
        ctx.scale(-1, 1);
        ctx.translate(-rp.x, -rp.y);
        drawBase(ctx, rp.x, rp.y, 40, 22, BASE_COLOR[b2], b2);
        ctx.restore();
    }

    txt(ctx, '← 당-인산 골격 →', cx, H - 6, '10px sans-serif', '#5B9BD5');
}

// ════════════════════════════════════════
//  RNA 단일 가닥
// ════════════════════════════════════════
function drawRNAStrand(canvas){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const bases = ['A','U','G','C','A','G','U','C','G','A'];
    const n = bases.length;
    const top = 30, bot = H - 20;
    const step = (bot - top) / n;
    const cx = W / 2;
    const amp = 55;

    txt(ctx, 'RNA 단일 가닥 구조', cx, 14, 'bold 12px sans-serif', '#c05621');

    // 골격 경로
    const pts = [];
    for(let i = 0; i < n; i++){
        const t = (i / (n - 1)) * Math.PI * 1.8;
        const y = top + i * step + step / 2;
        pts.push({ x: cx + amp * Math.sin(t), y });
    }

    // 리본 골격
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i = 1; i < pts.length; i++){
        const mx = (pts[i-1].x + pts[i].x) / 2;
        const my = (pts[i-1].y + pts[i].y) / 2;
        ctx.quadraticCurveTo(pts[i-1].x, pts[i-1].y, mx, my);
    }
    ctx.strokeStyle = '#E8A05A'; ctx.lineWidth = 10;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();

    // 인산 + 염기
    for(let i = 0; i < n; i++){
        const p  = pts[i];
        const b  = bases[i];
        const bc = BASE_COLOR[b];

        drawCircle(ctx, p.x, p.y, 12, PHOSPHATE);

        const bx = p.x + (p.x > cx ? 1 : -1) * 42;
        drawBase(ctx, bx, p.y, 36, 20, bc, b);
        line(ctx,
             p.x + 12 * (p.x > cx ? 1 : -1), p.y,
             bx - (p.x > cx ? 20 : -20),      p.y,
             '#bbb', 1.5);
    }

    txt(ctx, '↑ 당-인산 골격 (단일 가닥)', cx, H - 6,
        '10px sans-serif', '#E8A05A');
}

// ════════════════════════════════════════
//  카드 빌더 — DNA
//  ★ 모든 텍스트를 디옥시라이보스로 변경
// ════════════════════════════════════════
function buildDNACard(sec){
    const card = document.createElement('div');
    card.className = 'card';

    // 제목
    const titleDiv = document.createElement('div');
    titleDiv.className = 'card-title dna-title';
    titleDiv.textContent = '🔵 DNA의 구조';
    card.appendChild(titleDiv);

    // ① 뉴클레오타이드 일러스트
    addLabel(card, '▶ DNA를 구성하는 뉴클레오타이드');
    const cNuc = makeCanvas(360, 160);
    card.appendChild(cNuc);
    addDivider(card);

    // ② 체인
    addLabel(card, '▶ 뉴클레오타이드 연결 체인');
    const cChain = makeCanvas(360, 220);
    card.appendChild(cChain);
    addDivider(card);

    // ③ 이중 나선
    addLabel(card, '▶ DNA 이중 나선 구조');
    const cHelix = makeCanvas(360, 360);
    card.appendChild(cHelix);
    addDivider(card);

    // ④ 정보 박스 ★ 디옥시라이보스
    const info = document.createElement('div');
    info.className = 'info-box';
    info.innerHTML = `
        <b>📌 DNA 핵심 정리</b><br>
        · 당 : <b>디옥시라이보스</b> (5탄당, 2'OH 없음)<br>
        · 염기 :
            <span class="tag" style="background:#E8735A;color:white">A 아데닌</span>
            <span class="tag" style="background:#F5C842;color:#333">T 타이민</span>
            <span class="tag" style="background:#5BAD6F;color:white">G 구아닌</span>
            <span class="tag" style="background:#5B8ED6;color:white">C 사이토신</span><br>
        · 결합 : A <b>=</b> T (2중 수소결합) &nbsp; G <b>≡</b> C (3중 수소결합)<br>
        · 구조 : <b>이중 나선 (Double Helix)</b>
    `;
    card.appendChild(info);
    sec.appendChild(card);

    setTimeout(() => {
        drawNucleotideIllust(cNuc,   'DNA');
        drawChain(cChain,            'DNA');
        drawDNAHelix(cHelix);
    }, 60);
}

// ════════════════════════════════════════
//  카드 빌더 — RNA
//  ★ 모든 텍스트를 라이보스로 변경
// ════════════════════════════════════════
function buildRNACard(sec){
    const card = document.createElement('div');
    card.className = 'card';

    // 제목
    const titleDiv = document.createElement('div');
    titleDiv.className = 'card-title rna-title';
    titleDiv.textContent = '🟠 RNA의 구조';
    card.appendChild(titleDiv);

    // ① 뉴클레오타이드 일러스트
    addLabel(card, '▶ RNA를 구성하는 뉴클레오타이드');
    const cNuc = makeCanvas(360, 160);
    card.appendChild(cNuc);
    addDivider(card);

    // ② 체인
    addLabel(card, '▶ 뉴클레오타이드 연결 체인');
    const cChain = makeCanvas(360, 220);
    card.appendChild(cChain);
    addDivider(card);

    // ③ 단일 가닥
    addLabel(card, '▶ RNA 단일 가닥 구조');
    const cStrand = makeCanvas(360, 360);
    card.appendChild(cStrand);
    addDivider(card);

    // ④ 정보 박스 ★ 라이보스
    const info = document.createElement('div');
    info.className = 'info-box';
    info.innerHTML = `
        <b>📌 RNA 핵심 정리</b><br>
        · 당 : <b>라이보스</b> (5탄당, 2'OH 있음)<br>
        · 염기 :
            <span class="tag" style="background:#E8735A;color:white">A 아데닌</span>
            <span class="tag" style="background:#B57BDB;color:white">U 유라실</span>
            <span class="tag" style="background:#5BAD6F;color:white">G 구아닌</span>
            <span class="tag" style="background:#5B8ED6;color:white">C 사이토신</span><br>
        · 결합 : A <b>=</b> U (2중 수소결합) &nbsp; G <b>≡</b> C (3중 수소결합)<br>
        · 구조 : <b>단일 가닥 (Single Strand)</b>
    `;
    card.appendChild(info);
    sec.appendChild(card);

    setTimeout(() => {
        drawNucleotideIllust(cNuc,   'RNA');
        drawChain(cChain,            'RNA');
        drawRNAStrand(cStrand);
    }, 60);
}

// ════════════════════════════════════════
//  비교표 ★ 디옥시라이보스 / 라이보스
// ════════════════════════════════════════
function buildCompare(sec){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'width:100%;display:flex;justify-content:center;';

    const card = document.createElement('div');
    card.className = 'compare-card';
    card.innerHTML = `
        <h2>📊 DNA vs RNA 한눈에 비교</h2>
        <table>
            <tr>
                <th>구분</th>
                <th>🔵 DNA</th>
                <th>🟠 RNA</th>
            </tr>
            <tr>
                <td>가닥 수</td>
                <td>2중 나선 (이중 가닥)</td>
                <td>단일 가닥</td>
            </tr>
            <tr>
                <td>당(Sugar)</td>
                <td><b>디옥시라이보스</b><br>(5탄당, 2'OH ✗)</td>
                <td><b>라이보스</b><br>(5탄당, 2'OH ✓)</td>
            </tr>
            <tr>
                <td>염기</td>
                <td>A · T · G · C</td>
                <td>A · U · G · C</td>
            </tr>
            <tr>
                <td>T vs U</td>
                <td>타이민(T) 존재</td>
                <td>유라실(U) 존재</td>
            </tr>
            <tr>
                <td>주요 기능</td>
                <td>유전 정보 저장</td>
                <td>단백질 합성 관여</td>
            </tr>
            <tr>
                <td>주요 위치</td>
                <td>세포핵 (염색체)</td>
                <td>핵 &amp; 세포질</td>
            </tr>
            <tr>
                <td>안정성</td>
                <td>높음 (안정적)</td>
                <td>낮음 (불안정)</td>
            </tr>
        </table>
    `;
    wrap.appendChild(card);
    sec.appendChild(wrap);
}

// ════════════════════════════════════════
//  소형 헬퍼
// ════════════════════════════════════════
function addLabel(parent, text){
    const d = document.createElement('div');
    d.className = 'section-label';
    d.textContent = text;
    parent.appendChild(d);
}
function addDivider(parent){
    const hr = document.createElement('hr');
    hr.className = 'divider';
    parent.appendChild(hr);
}
</script>
